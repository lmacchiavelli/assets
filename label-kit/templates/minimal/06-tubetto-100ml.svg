<?xml version="1.0" encoding="UTF-8"?>
<!-- Label Kit — stile MINIMAL — Tubetto 100 ml — verticale — misura finita 50 × 110 mm, abbondanza 3.0 mm per lato, area sicura 3.0 mm.
     Livelli (gruppi di primo livello): GRAFICA, TESTI, SIMBOLI, AREA_SICURA, FUSTELLA, ABBONDANZA, CROCINI, NOTE.
     Prima di esportare: nascondi AREA_SICURA, ABBONDANZA, NOTE; FUSTELLA su colore spot "CutContour" o nascosta (chiedi alla tipografia). -->
<svg xmlns="http://www.w3.org/2000/svg" width="56.00mm" height="116.00mm" viewBox="0 0 56.00 116.00">
<title>Tubetto 100 ml — verticale · minimal</title>
<g id="GRAFICA" data-name="GRAFICA - sfondo, pattern, illustrazioni">
<rect x="0" y="0" width="56.00" height="116.00" fill="#f4efe6"/>
<rect x="6.00" y="6.00" width="44.00" height="104.00" fill="none" stroke="#1f6f5b" stroke-width="0.4" rx="1"/>
</g>
<g id="TESTI" data-name="TESTI - nome, claim, INCI, avvertenze">
<text x="28.00" y="38.20" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-weight="600" font-size="2.4" letter-spacing="0.6" fill="#1f6f5b">NOME BRAND</text>
<text x="28.00" y="59.50" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500" font-size="4.5" fill="#1b1a17">Nome Prodotto</text>
<text x="28.00" y="75.60" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="2" fill="#6b665c">claim breve · funzione</text>
<text x="28.00" y="108.50" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="2" fill="#1b1a17">50 ml ℮</text>
</g>
<g id="SIMBOLI" data-name="SIMBOLI OBBLIGATORI - incolla da cartella simboli">
<rect x="36.00" y="104.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="38.00" y="106.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">PAO</text>
<rect x="40.60" y="104.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="42.60" y="106.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">℮</text>
<rect x="45.20" y="104.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="47.20" y="106.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">♻</text>
</g>
<g id="ABBONDANZA" data-name="ABBONDANZA (3 mm) - non stampare">
<rect x="0" y="0" width="56.00" height="116.00" fill="none" stroke="#ff00ff" stroke-width="0.15" stroke-dasharray="1 1"/>
</g>
<g id="FUSTELLA" data-name="FUSTELLA - linea di taglio">
<rect x="3.00" y="3.00" width="50.00" height="110.00" rx="2" fill="none" stroke="#00a0e9" stroke-width="0.2"/>
</g>
<g id="AREA_SICURA" data-name="AREA SICURA (3 mm dal taglio) - tieni dentro i testi">
<rect x="6.00" y="6.00" width="44.00" height="104.00" fill="none" stroke="#00c853" stroke-width="0.15" stroke-dasharray="2 1"/>
<rect x="3.00" y="105.00" width="50.00" height="8" fill="#ff9800" fill-opacity="0.15" stroke="none"/>
<text x="28.00" y="109.50" font-family="Helvetica, Arial" font-size="1.8" fill="#ff9800" text-anchor="middle">ZONA SALDATURA - niente testi</text>
</g>
<g id="CROCINI" data-name="CROCINI DI TAGLIO"><line x1="2.00" y1="3.00" x2="-1.00" y2="3.00" stroke="#000" stroke-width="0.1"/><line x1="3.00" y1="2.00" x2="3.00" y2="-1.00" stroke="#000" stroke-width="0.1"/><line x1="54.00" y1="3.00" x2="57.00" y2="3.00" stroke="#000" stroke-width="0.1"/><line x1="53.00" y1="2.00" x2="53.00" y2="-1.00" stroke="#000" stroke-width="0.1"/><line x1="2.00" y1="113.00" x2="-1.00" y2="113.00" stroke="#000" stroke-width="0.1"/><line x1="3.00" y1="114.00" x2="3.00" y2="117.00" stroke="#000" stroke-width="0.1"/><line x1="54.00" y1="113.00" x2="57.00" y2="113.00" stroke="#000" stroke-width="0.1"/><line x1="53.00" y1="114.00" x2="53.00" y2="117.00" stroke="#000" stroke-width="0.1"/></g>
<g id="NOTE" data-name="NOTE PER IL DESIGNER - non stampare">
<text x="3.00" y="116.00" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e" transform="translate(0,-0.6)">Tubetto 100 ml — verticale · 50×110 mm · Crema mani, gel, dentifricio · magenta = abbondanza · ciano = taglio · verde = area sicura</text>
</g>
</svg>
