<text x="45.50" y="44.50" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-weight="700" font-size="7" fill="#10213a">Nome Prodotto</text>
<text x="45.50" y="55.80" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="2.6" fill="#5c6b80">claim breve · funzione</text>
<text x="45.50" y="78.50" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="2.6" fill="#10213a">50 ml ℮</text>
<text x="93.00" y="18.00" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.8" fill="#10213a" xml:space="preserve">INGREDIENTI / INCI: Aqua, Glycerin, ... (min. 1,2 mm x-height consigliata)</text>
<text x="93.00" y="21.20" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.8" fill="#10213a" xml:space="preserve">MODO D'USO: ...</text>
<text x="93.00" y="24.40" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.8" fill="#10213a" xml:space="preserve">AVVERTENZE: ...</text>
<text x="93.00" y="27.60" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.8" fill="#10213a" xml:space="preserve">Responsabile immissione sul mercato: Nome, Indirizzo, Città (IT)</text>
<text x="93.00" y="30.80" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.8" fill="#10213a" xml:space="preserve">Lotto: vedi fondo · Made in Italy</text>
<rect x="93.00" y="34.00" width="72.00" height="36.00" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.5 0.5"/>
<text x="94.00" y="36.50" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.5" fill="#9e9e9e">area testi aggiuntivi / codice a barre</text>
</g>
