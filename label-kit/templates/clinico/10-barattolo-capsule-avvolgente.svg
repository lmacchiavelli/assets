<rect x="6.00" y="6.00" width="164.00" height="74.00" fill="none" stroke="#00c853" stroke-width="0.15" stroke-dasharray="2 1"/>
<rect x="168.00" y="3.00" width="5" height="80.00" fill="#ff9800" fill-opacity="0.15" stroke="none"/>
