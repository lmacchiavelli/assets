<?xml version="1.0" encoding="UTF-8"?>
<!-- Label Kit — Bustina / doypack integratore — misura finita 90 × 130 mm, abbondanza 3.0 mm per lato, area sicura 3.0 mm.
     Livelli (gruppi di primo livello): GRAFICA, TESTI, SIMBOLI, AREA_SICURA, FUSTELLA, ABBONDANZA, CROCINI, NOTE.
     Prima di esportare: nascondi AREA_SICURA, ABBONDANZA, NOTE; FUSTELLA su colore spot "CutContour" o nascosta (chiedi alla tipografia). -->
<svg xmlns="http://www.w3.org/2000/svg" width="96.00mm" height="136.00mm" viewBox="0 0 96.00 136.00">
<title>Bustina / doypack integratore</title>
<g id="GRAFICA" data-name="GRAFICA - sfondo, pattern, illustrazioni">
<rect x="0" y="0" width="96.00" height="136.00" fill="#f4efe6"/>
<rect x="6.00" y="6.00" width="84.00" height="124.00" fill="none" stroke="#1f6f5b" stroke-width="0.4" rx="1"/>
</g>
<g id="TESTI" data-name="TESTI - nome, claim, INCI, avvertenze">
<text x="48.00" y="44.60" text-anchor="middle" font-family="Helvetica, Arial" font-size="3.2" letter-spacing="0.6" fill="#1f6f5b">NOME BRAND</text>
<text x="48.00" y="69.50" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#1b1a17">Nome Prodotto</text>
<text x="48.00" y="88.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="2.6" fill="#6b665c">claim breve · funzione</text>
<text x="48.00" y="128.50" text-anchor="middle" font-family="Helvetica, Arial" font-size="2.6" fill="#1b1a17">50 ml ℮</text>
</g>
<g id="SIMBOLI" data-name="SIMBOLI OBBLIGATORI - incolla da cartella simboli">
<rect x="76.00" y="124.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="78.00" y="126.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">PAO</text>
<rect x="80.60" y="124.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="82.60" y="126.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">℮</text>
<rect x="85.20" y="124.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="87.20" y="126.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">♻</text>
</g>
<g id="ABBONDANZA" data-name="ABBONDANZA (3 mm) - non stampare">
<rect x="0" y="0" width="96.00" height="136.00" fill="none" stroke="#ff00ff" stroke-width="0.15" stroke-dasharray="1 1"/>
</g>
<g id="FUSTELLA" data-name="FUSTELLA - linea di taglio">
<rect x="3.00" y="3.00" width="90.00" height="130.00" rx="2" fill="none" stroke="#00a0e9" stroke-width="0.2"/>
</g>
<g id="AREA_SICURA" data-name="AREA SICURA (3 mm dal taglio) - tieni dentro i testi">
<rect x="6.00" y="6.00" width="84.00" height="124.00" fill="none" stroke="#00c853" stroke-width="0.15" stroke-dasharray="2 1"/>
</g>
<g id="CROCINI" data-name="CROCINI DI TAGLIO"><line x1="2.00" y1="3.00" x2="-1.00" y2="3.00" stroke="#000" stroke-width="0.1"/><line x1="3.00" y1="2.00" x2="3.00" y2="-1.00" stroke="#000" stroke-width="0.1"/><line x1="94.00" y1="3.00" x2="97.00" y2="3.00" stroke="#000" stroke-width="0.1"/><line x1="93.00" y1="2.00" x2="93.00" y2="-1.00" stroke="#000" stroke-width="0.1"/><line x1="2.00" y1="133.00" x2="-1.00" y2="133.00" stroke="#000" stroke-width="0.1"/><line x1="3.00" y1="134.00" x2="3.00" y2="137.00" stroke="#000" stroke-width="0.1"/><line x1="94.00" y1="133.00" x2="97.00" y2="133.00" stroke="#000" stroke-width="0.1"/><line x1="93.00" y1="134.00" x2="93.00" y2="137.00" stroke="#000" stroke-width="0.1"/></g>
<g id="NOTE" data-name="NOTE PER IL DESIGNER - non stampare">
<text x="3.00" y="136.00" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e" transform="translate(0,-0.6)">Bustina / doypack integratore · 90×130 mm · Fronte stand-up pouch · magenta = abbondanza · ciano = taglio · verde = area sicura</text>
</g>
</svg>
