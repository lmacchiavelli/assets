<rect x="0" y="0" width="176.00" height="13.00" fill="#2a6fdb"/>
<rect x="0" y="13.00" width="176.00" height="0.5" fill="#10213a" fill-opacity="0.15"/>
<rect x="6.00" y="24.67" width="164.00" height="0.15" fill="#2a6fdb" fill-opacity="0.12"/>
<rect x="6.00" y="36.33" width="164.00" height="0.15" fill="#2a6fdb" fill-opacity="0.12"/>
