<!-- Label Kit — stile CLINICO — Barattolo capsule — avvolgente — misura finita 170 × 80 mm, abbondanza 3.0 mm per lato, area sicura 3.0 mm.
     Livelli (gruppi di primo livello): GRAFICA, TESTI, SIMBOLI, AREA_SICURA, FUSTELLA, ABBONDANZA, CROCINI, NOTE.
     Prima di esportare: nascondi AREA_SICURA, ABBONDANZA, NOTE; FUSTELLA su colore spot "CutContour" o nascosta (chiedi alla tipografia). -->
<svg xmlns="http://www.w3.org/2000/svg" width="176.00mm" height="86.00mm" viewBox="0 0 176.00 86.00">
<title>Barattolo capsule — avvolgente · clinico</title>
