<rect x="158.00" y="3.00" width="5" height="30.00" fill="#ff9800" fill-opacity="0.15" stroke="none"/>
<text x="160.50" y="18.00" font-family="Helvetica, Arial" font-size="2" fill="#ff9800" text-anchor="middle" transform="rotate(-90 160.50 18.00)">SOVRAPPOSIZIONE 5 mm</text>
<line x1="83.00" y1="3.00" x2="83.00" y2="33.00" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.5 0.5"/>
<text x="43.00" y="5.50" font-family="Helvetica, Arial" font-size="1.8" fill="#9e9e9e" text-anchor="middle">FRONTE</text>
<text x="123.00" y="5.50" font-family="Helvetica, Arial" font-size="1.8" fill="#9e9e9e" text-anchor="middle">RETRO</text>
</g>
<g id="CROCINI" data-name="CROCINI DI TAGLIO"><line x1="2.00" y1="3.00" x2="-1.00" y2="3.00" stroke="#000" stroke-width="0.1"/><line x1="3.00" y1="2.00" x2="3.00" y2="-1.00" stroke="#000" stroke-width="0.1"/><line x1="164.00" y1="3.00" x2="167.00" y2="3.00" stroke="#000" stroke-width="0.1"/><line x1="163.00" y1="2.00" x2="163.00" y2="-1.00" stroke="#000" stroke-width="0.1"/><line x1="2.00" y1="33.00" x2="-1.00" y2="33.00" stroke="#000" stroke-width="0.1"/><line x1="3.00" y1="34.00" x2="3.00" y2="37.00" stroke="#000" stroke-width="0.1"/><line x1="164.00" y1="33.00" x2="167.00" y2="33.00" stroke="#000" stroke-width="0.1"/><line x1="163.00" y1="34.00" x2="163.00" y2="37.00" stroke="#000" stroke-width="0.1"/></g>
<g id="NOTE" data-name="NOTE PER IL DESIGNER - non stampare">
<text x="3.00" y="36.00" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e" transform="translate(0,-0.6)">Vasetto 50 ml — fascia laterale · 160×30 mm · Fascia avvolgente sotto il coperchio · magenta = abbondanza · ciano = taglio · verde = area sicura</text>
</g>
