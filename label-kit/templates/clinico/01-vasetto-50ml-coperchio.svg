<!-- Label Kit — stile CLINICO — Vasetto 50 ml — coperchio — misura finita 60 × 60 mm, abbondanza 3.0 mm per lato, area sicura 3.0 mm.
     Livelli (gruppi di primo livello): GRAFICA, TESTI, SIMBOLI, AREA_SICURA, FUSTELLA, ABBONDANZA, CROCINI, NOTE.
     Prima di esportare: nascondi AREA_SICURA, ABBONDANZA, NOTE; FUSTELLA su colore spot "CutContour" o nascosta (chiedi alla tipografia). -->
<svg xmlns="http://www.w3.org/2000/svg" width="66.00mm" height="66.00mm" viewBox="0 0 66.00 66.00">
<title>Vasetto 50 ml — coperchio · clinico</title>
<g id="GRAFICA" data-name="GRAFICA - sfondo, pattern, illustrazioni">
<circle cx="33.00" cy="33.00" r="33.00" fill="#ffffff"/>
<path d="M0.00 33.00 A33.00 33.00 0 0 0 66.00 33.00 Z" fill="#2a6fdb" fill-opacity="0.08"/>
<rect x="3.00" y="32.70" width="60.00" height="0.6" fill="#2a6fdb"/>
</g>
<g id="TESTI" data-name="TESTI - nome, claim, INCI, avvertenze">
<text x="33.00" y="22.20" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-weight="600" font-size="3.2" letter-spacing="0.6" fill="#2a6fdb">NOME BRAND</text>
<text x="33.00" y="34.50" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-weight="700" font-size="7" fill="#10213a">Nome Prodotto</text>
<text x="33.00" y="42.60" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="2.6" fill="#5c6b80">claim breve · funzione</text>
<text x="33.00" y="58.50" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="2.6" fill="#10213a">50 ml ℮</text>
</g>
<g id="SIMBOLI" data-name="SIMBOLI OBBLIGATORI - incolla da cartella simboli">
<rect x="27.00" y="52.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="29.00" y="54.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">PAO</text>
<rect x="31.60" y="52.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="33.60" y="54.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">℮</text>
<rect x="36.20" y="52.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="38.20" y="54.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">♻</text>
</g>
<g id="ABBONDANZA" data-name="ABBONDANZA (3 mm) - non stampare">
<circle cx="33.00" cy="33.00" r="33.00" fill="none" stroke="#ff00ff" stroke-width="0.15" stroke-dasharray="1 1"/>
</g>
<g id="FUSTELLA" data-name="FUSTELLA - linea di taglio">
