<g id="NOTE" data-name="NOTE PER IL DESIGNER - non stampare">
<text x="3.00" y="86.00" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e" transform="translate(0,-0.6)">Barattolo capsule — avvolgente · 170×80 mm · Barattolo 100–150 cc · magenta = abbondanza · ciano = taglio · verde = area sicura</text>
