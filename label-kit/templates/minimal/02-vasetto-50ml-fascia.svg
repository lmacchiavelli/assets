<!-- Label Kit — stile MINIMAL — Vasetto 50 ml — fascia laterale — misura finita 160 × 30 mm, abbondanza 3.0 mm per lato, area sicura 3.0 mm.
     Livelli (gruppi di primo livello): GRAFICA, TESTI, SIMBOLI, AREA_SICURA, FUSTELLA, ABBONDANZA, CROCINI, NOTE.
     Prima di esportare: nascondi AREA_SICURA, ABBONDANZA, NOTE; FUSTELLA su colore spot "CutContour" o nascosta (chiedi alla tipografia). -->
<svg xmlns="http://www.w3.org/2000/svg" width="166.00mm" height="36.00mm" viewBox="0 0 166.00 36.00">
<title>Vasetto 50 ml — fascia laterale · minimal</title>
<g id="GRAFICA" data-name="GRAFICA - sfondo, pattern, illustrazioni">
<rect x="0" y="0" width="166.00" height="36.00" fill="#f4efe6"/>
<rect x="6.00" y="6.00" width="154.00" height="24.00" fill="none" stroke="#1f6f5b" stroke-width="0.4" rx="1"/>
</g>
<g id="TESTI" data-name="TESTI - nome, claim, INCI, avvertenze">
<text x="43.00" y="12.60" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-weight="600" font-size="2.4" letter-spacing="0.6" fill="#1f6f5b">NOME BRAND</text>
<text x="43.00" y="19.50" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="500" font-size="4.5" fill="#1b1a17">Nome Prodotto</text>
<text x="43.00" y="22.80" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="2" fill="#6b665c">claim breve · funzione</text>
<text x="43.00" y="28.50" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="2" fill="#1b1a17">50 ml ℮</text>
<text x="88.00" y="11.00" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.8" fill="#1b1a17" xml:space="preserve">INGREDIENTI / INCI: Aqua, Glycerin, ... (min. 1,2 mm x-height consigliata)</text>
<text x="88.00" y="14.20" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.8" fill="#1b1a17" xml:space="preserve">MODO D'USO: ...</text>
<text x="88.00" y="17.40" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.8" fill="#1b1a17" xml:space="preserve">AVVERTENZE: ...</text>
<text x="88.00" y="20.60" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.8" fill="#1b1a17" xml:space="preserve">Responsabile immissione sul mercato: Nome, Indirizzo, Città (IT)</text>
<text x="88.00" y="23.80" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.8" fill="#1b1a17" xml:space="preserve">Lotto: vedi fondo · Made in Italy</text>
<rect x="88.00" y="27.00" width="67.00" height="4.00" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.5 0.5"/>
<text x="89.00" y="29.50" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="1.5" fill="#9e9e9e">area testi aggiuntivi / codice a barre</text>
</g>
<g id="SIMBOLI" data-name="SIMBOLI OBBLIGATORI - incolla da cartella simboli">
<rect x="141.00" y="24.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="143.00" y="26.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">PAO</text>
<rect x="145.60" y="24.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="147.60" y="26.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">℮</text>
<rect x="150.20" y="24.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="152.20" y="26.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">♻</text>
</g>
<g id="ABBONDANZA" data-name="ABBONDANZA (3 mm) - non stampare">
