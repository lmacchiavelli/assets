<?xml version="1.0" encoding="UTF-8"?>
<!-- Label Kit — stile CLINICO — Etichetta rettangolare generica — misura finita 100 × 60 mm, abbondanza 3.0 mm per lato, area sicura 3.0 mm.
     Livelli (gruppi di primo livello): GRAFICA, TESTI, SIMBOLI, AREA_SICURA, FUSTELLA, ABBONDANZA, CROCINI, NOTE.
     Prima di esportare: nascondi AREA_SICURA, ABBONDANZA, NOTE; FUSTELLA su colore spot "CutContour" o nascosta (chiedi alla tipografia). -->
<svg xmlns="http://www.w3.org/2000/svg" width="106.00mm" height="66.00mm" viewBox="0 0 106.00 66.00">
<title>Etichetta rettangolare generica · clinico</title>
<g id="GRAFICA" data-name="GRAFICA - sfondo, pattern, illustrazioni">
<rect x="0" y="0" width="106.00" height="66.00" fill="#ffffff"/>
<rect x="0" y="0" width="106.00" height="13.00" fill="#2a6fdb"/>
<rect x="0" y="13.00" width="106.00" height="0.5" fill="#10213a" fill-opacity="0.15"/>
<rect x="6.00" y="21.33" width="94.00" height="0.15" fill="#2a6fdb" fill-opacity="0.12"/>
<rect x="6.00" y="29.67" width="94.00" height="0.15" fill="#2a6fdb" fill-opacity="0.12"/>
<rect x="6.00" y="38.00" width="94.00" height="0.15" fill="#2a6fdb" fill-opacity="0.12"/>
<rect x="6.00" y="46.33" width="94.00" height="0.15" fill="#2a6fdb" fill-opacity="0.12"/>
<rect x="6.00" y="54.67" width="94.00" height="0.15" fill="#2a6fdb" fill-opacity="0.12"/>
</g>
<g id="TESTI" data-name="TESTI - nome, claim, INCI, avvertenze">
<text x="53.00" y="9.14" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-weight="600" font-size="3.2" letter-spacing="0.6" fill="#ffffff">NOME BRAND</text>
<text x="53.00" y="34.50" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-weight="700" font-size="7" fill="#10213a">Nome Prodotto</text>
<text x="53.00" y="42.60" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="2.6" fill="#5c6b80">claim breve · funzione</text>
<text x="53.00" y="58.50" text-anchor="middle" font-family="'Inter', Helvetica, Arial, sans-serif" font-size="2.6" fill="#10213a">50 ml ℮</text>
</g>
<g id="SIMBOLI" data-name="SIMBOLI OBBLIGATORI - incolla da cartella simboli">
<rect x="86.00" y="54.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="88.00" y="56.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">PAO</text>
<rect x="90.60" y="54.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="92.60" y="56.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">℮</text>
<rect x="95.20" y="54.00" width="4" height="4" rx="0.5" fill="none" stroke="#9e9e9e" stroke-width="0.1" stroke-dasharray="0.4 0.4"/>
<text x="97.20" y="56.80" text-anchor="middle" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e">♻</text>
</g>
<g id="ABBONDANZA" data-name="ABBONDANZA (3 mm) - non stampare">
<rect x="0" y="0" width="106.00" height="66.00" fill="none" stroke="#ff00ff" stroke-width="0.15" stroke-dasharray="1 1"/>
</g>
<g id="FUSTELLA" data-name="FUSTELLA - linea di taglio">
<rect x="3.00" y="3.00" width="100.00" height="60.00" rx="2" fill="none" stroke="#00a0e9" stroke-width="0.2"/>
</g>
<g id="AREA_SICURA" data-name="AREA SICURA (3 mm dal taglio) - tieni dentro i testi">
<rect x="6.00" y="6.00" width="94.00" height="54.00" fill="none" stroke="#00c853" stroke-width="0.15" stroke-dasharray="2 1"/>
</g>
<g id="CROCINI" data-name="CROCINI DI TAGLIO"><line x1="2.00" y1="3.00" x2="-1.00" y2="3.00" stroke="#000" stroke-width="0.1"/><line x1="3.00" y1="2.00" x2="3.00" y2="-1.00" stroke="#000" stroke-width="0.1"/><line x1="104.00" y1="3.00" x2="107.00" y2="3.00" stroke="#000" stroke-width="0.1"/><line x1="103.00" y1="2.00" x2="103.00" y2="-1.00" stroke="#000" stroke-width="0.1"/><line x1="2.00" y1="63.00" x2="-1.00" y2="63.00" stroke="#000" stroke-width="0.1"/><line x1="3.00" y1="64.00" x2="3.00" y2="67.00" stroke="#000" stroke-width="0.1"/><line x1="104.00" y1="63.00" x2="107.00" y2="63.00" stroke="#000" stroke-width="0.1"/><line x1="103.00" y1="64.00" x2="103.00" y2="67.00" stroke="#000" stroke-width="0.1"/></g>
<g id="NOTE" data-name="NOTE PER IL DESIGNER - non stampare">
<text x="3.00" y="66.00" font-family="Helvetica, Arial" font-size="1.6" fill="#9e9e9e" transform="translate(0,-0.6)">Etichetta rettangolare generica · 100×60 mm · Qualsiasi contenitore · magenta = abbondanza · ciano = taglio · verde = area sicura</text>
</g>
